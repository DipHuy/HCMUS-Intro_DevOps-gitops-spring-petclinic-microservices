{{- range $name, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}

spec:
  type: NodePort

  selector:
    app: {{ $name }}

  ports:
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
      nodePort: {{ $service.nodePort }}

---
{{- end }}